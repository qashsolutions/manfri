openapi: 3.1.0
info:
  title: ManFriday Internal API
  version: 0.0.0
  description: >-
    Phase 0 contract stub for the BFF↔FastAPI seam. From WP 0.12 the
    authoritative spec is the one FastAPI emits, and CI fails on drift between
    it and the generated TypeScript client. This hand-written stub seeds the
    seam and the openapi-typescript generation for the walking skeleton.
servers:
  - url: http://localhost:8000
    description: Local FastAPI service
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness/readiness probe (Phase 0 walking skeleton).
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, service, phase]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        phase:
          type: integer
