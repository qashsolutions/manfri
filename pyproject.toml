# Root of the uv workspace for ManFriday's Python services. This is a virtual
# root (package = false): it is never built or published; it only declares the
# workspace members and the shared dev toolchain + lint/type/test config.
[project]
name = "manfriday-workspace"
version = "0.0.0"
description = "ManFriday Python services workspace root (Phase 0)."
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/api", "services/workers"]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "httpx>=0.27",
]

# ── Ruff (lint + format) ─────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services/api", "services/workers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# ── mypy (strict, type-check the services) ───────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# FastAPI/Arq decorators are typed but indirectly; don't fail on them.
disallow_untyped_decorators = false
# Type-check the service source packages (tests use a separate, looser path).
files = ["services/api/app", "services/workers/worker"]

# ── pytest ───────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["services"]
# importlib mode: lets same-named test dirs across services coexist without
# colliding on a shared top-level `tests` package (no __init__.py needed).
addopts = "--import-mode=importlib"
