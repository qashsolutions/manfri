name: CI

on:
  push:
    branches: [main, "phase-*", "phase-*/**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  js:
    name: JS — typecheck · lint · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate API types from the OpenAPI contract
        run: pnpm --filter @manfriday/contracts gen
      - name: Contract drift — generated types must match the committed spec
        run: git diff --exit-code -- packages/contracts/src/generated
      - name: Build (generates Next types + type-checks web)
        run: pnpm --filter @manfriday/web build
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present lint

  python:
    name: Python — ruff · mypy · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format check)
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy
      - name: pytest
        run: uv run pytest

  container:
    name: Container — build api image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build FastAPI image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          tags: manfriday-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
