[project]
name = "manfriday-workers"
version = "0.0.0"
description = "ManFriday background workers (Arq) — Phase 0 skeleton."
requires-python = ">=3.12"
dependencies = [
  "arq>=0.26",
  "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
