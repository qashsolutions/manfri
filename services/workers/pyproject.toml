[project]
name = "manfriday-workers"
version = "0.0.0"
description = "ManFriday background workers (Arq) — Phase 0 ingestion worker."
requires-python = ">=3.12"
dependencies = [
  "arq>=0.26",
  "redis>=5.0",
  "manfriday-api",
]

[tool.uv.sources]
manfriday-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
