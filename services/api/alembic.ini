# Alembic config. The database URL is set programmatically in alembic/env.py
# (it connects as the superuser/owner to create roles, tables, RLS policies, and
# grants — the app's manfriday_app role cannot do DDL). script_location is
# resolved relative to this file so it works from any CWD.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
