[project]
name = "manfriday-api"
version = "0.0.0"
description = "ManFriday FastAPI AI services (Phase 0 skeleton — no decision logic)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "cryptography>=43",
  "presidio-analyzer>=2.2",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "jsonschema>=4.21",
  "litellm>=1.50",
  "pyjwt[crypto]>=2.8",
  "pyotp>=2.9",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "sentry-sdk>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
# Allow the pinned spaCy model wheel (direct URL) as a dependency.
allow-direct-references = true
