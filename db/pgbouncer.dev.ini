# Dev/CI PgBouncer config for the WP 0.3 leak probe's transaction-pooling path.
# pool_mode=transaction + default_pool_size=1 forces every client transaction to
# multiplex onto ONE shared server connection — the worst case for context bleed.
# The probe proves set_config(..., is_local=>true) (SET LOCAL) is cleared at
# COMMIT by Postgres itself, so tenant context never leaks across pooled txns.
# auth_type=any: PgBouncer ignores the client-supplied user and connects to PG as
# the [databases] `user=` (manfriday_app), relying on PG trust (local pg_hba / CI
# POSTGRES_HOST_AUTH_METHOD=trust). No auth_file needed. DEV/CI ONLY.
[databases]
manfriday_dev = host=127.0.0.1 port=5432 dbname=manfriday_dev user=manfriday_app

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = any
pool_mode = transaction
default_pool_size = 1
max_client_conn = 100
logfile = /tmp/pgbouncer-manfriday.log
pidfile = /tmp/pgbouncer-manfriday.pid
